classname=com.sklotopolis.mod.server.distantTerrainRefinement.DistantTerrainRefinementServerMod
classpath=DistantTerrainRefinement.jar
sharedClassLoader=true

# Sends 2x2- and 8x8-tile distant terrain heights to players running the SkloGraphics client mod
# (useDistantTerrainRefinement) with Extended View on, so their distant hills are drawn smoothly
# instead of in vanilla's 16x16-tile steps. Players without it are sent nothing extra and see no
# difference. See README.md.
#
# It also sends SkloGraphics players a catalogue of default (E key) actions for every item and
# creature template on this server, so the client never has to ask before showing one. To change
# what E does on something, add lines like these (comma list, best first; see DefaultActionCatalog):
#   defaultAction.item.<templateId>=<actionId>[@tool[+tool]][!][?]   or   =none
#   defaultAction.creature.<templateId>=...
#   defaultAction.tile.<tileTypeId>=...
# tools: dig mine slash axe saw sickle scythe field cultivate butcher fish scissors liquid groom
# lead seed sharp bucket; "!" = only with such a tool already active; "?" = confirm per target.
#defaultAction.item.852=3
#defaultAction.creature.64=106@lead?

# Lets SkloGraphics players see far into caves (their caveViewDistance, 32-96 tiles) instead of the
# vanilla 24. Fully enclosed rock beyond the vanilla range is sent as plain cave wall, so no ore veins
# are revealed. Only sent while the player is underground. 0 turns it off.
#caveViewDistanceMax=96

# Makes rain rarer and clear skies more common by nudging vanilla's weather drift after every
# weather tick (~70 s). weatherRainBias pulls the rain target down, weatherCloudBias the cloud target;
# the cloud one is far stronger (rain can never exceed cloudiness). Defaults roughly halve the time it
# rains (30% -> 15%) and nearly double sunny weather (26% -> 48%) while still allowing storms;
# weatherCloudBias=0.02 or more removes heavy rain and overcast skies almost entirely. 0 = vanilla.
#weatherRainBias=0.15
#weatherCloudBias=0.007

# Right-click menus of SkloGraphics players list every action they could do on the target with any
# item they carry, not only with the active one; each shows the tool's icon and clicking it activates
# the best (highest QL) such tool first. The menu is built once per distinct item kind carried, up to
# toolMenuMaxTools of them (tools and weapons first); a slow build is logged. Off = vanilla menus.
#toolMenu=true
#toolMenuMaxTools=150
